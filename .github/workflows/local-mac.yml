name: Validar Atlas Linhas no macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar e compilar como no Mac do usuário
        run: bash scripts/instalar-mac.sh
      - name: Conferir TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Conferir acionamento automático e instalador
        run: node --test tests/automation/*.test.mjs
      - name: Verificar binários do instalador sem registrar executor
        run: bash scripts/ativar-testes-automaticos-mac.sh verificar-ferramentas
      - name: Testar aplicação com banco e arquivos locais
        run: npm run local:test
      - name: Instalar navegador de testes
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Testar interface com dados temporários
        run: node node_modules/@playwright/test/cli.js test
      - name: Guardar relatório e evidências
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-interface-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
